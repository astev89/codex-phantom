services:
  codex-phantom:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3210:3210"
    env_file:
      - path: .env
        required: false
    environment:
      OPERATOR_BEARER_TOKEN: ${OPERATOR_BEARER_TOKEN:?Set OPERATOR_BEARER_TOKEN}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?Set MCP_BEARER_TOKEN}
      EXTERNAL_CHANNEL_SECRET: ${EXTERNAL_CHANNEL_SECRET:?Set EXTERNAL_CHANNEL_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QDRANT_ENABLED: "true"
      QDRANT_URL: http://qdrant:6333
    volumes:
      - codex-phantom-data:/app/data
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  codex-phantom-data:
    name: codex-phantom-data
  qdrant-data:
    name: codex-phantom-qdrant-data

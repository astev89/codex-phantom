services:
  codex-phantom:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3210:3210"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      CODEX_PHANTOM_DATA_DIR: /app/data
      CODEX_PHANTOM_DATABASE_PATH: /app/data/codex-phantom.sqlite
      OPERATOR_BEARER_TOKEN: ${OPERATOR_BEARER_TOKEN:-local-dev-operator-token}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-local-dev-mcp-token}
      EXTERNAL_CHANNEL_SECRET: ${EXTERNAL_CHANNEL_SECRET:-local-dev-channel-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-medium}
      OPENAI_MEMORY_REASONING_EFFORT: ${OPENAI_MEMORY_REASONING_EFFORT:-low}
      QDRANT_ENABLED: "true"
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-codex-phantom-memory}
      QDRANT_TIMEOUT_MS: ${QDRANT_TIMEOUT_MS:-5000}
    volumes:
      - codex-phantom-data:/app/data
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200 OK'",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  codex-phantom-data:
    name: codex-phantom-data
  qdrant-data:
    name: codex-phantom-qdrant-data
